# Blueprint da Render: descreve o serviço da API como código. Na Render: New > Blueprint > escolher este
# repositório. Os valores marcados com "sync: false" são pedidos na tela (segredos nunca ficam no Git).
services:
  - type: web
    name: myck-productivity-api
    runtime: docker
    plan: free
    # Mesma região do banco no Neon (AWS us-east-2, Ohio): cada consulta atravessa menos distância
    region: ohio
    dockerfilePath: ./Dockerfile
    # A Render só considera o deploy pronto quando isto responde 200; se a versão nova não subir, a antiga continua no ar
    healthCheckPath: /actuator/health
    # Deploy automático a cada push na main
    autoDeploy: true
    branch: main
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Banco (Neon): URL JDBC com ?sslmode=require, usuário e senha do painel do Neon
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # A Render gera um valor aleatório forte na criação (e mantém nos próximos deploys)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "60"
      # Endereço do front-end publicado (e o local, para desenvolver o front contra a API no ar)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Telegram: o webhook exige URL e segredo. O segredo só aceita letras, números, _ e -, por isso
      # é gerado à mão (openssl rand -hex 32) e não pelo generateValue (que usa base64, com + / =)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
